
<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Liste Bdgainé</title>
	<link rel="icon" type="image/png" href="assets/images/logo.png">
	<link rel="stylesheet" href="styles.css">
	<script src="script.js" defer></script>
</head>
<body>
	<div class="banner">
		<img src="assets/images/logo.png" alt="Dragon gauche" class="banner-dragon left">
		<nav class="banner-menu">
			<div class="nous-suivre-wrapper">
				<a href="#" class="banner-link" id="nous-suivre-btn">Nous suivre</a>
				<div class="social-dropdown" id="social-dropdown">
					<img src="assets/images/socialnetwork.png" alt="Parchemin réseaux sociaux" class="social-parchment">
					<div class="social-icons">
						<a href="https://www.facebook.com/LISTE_BDGAINE" target="_blank" class="social-link">
							<img src="https://upload.wikimedia.org/wikipedia/commons/5/51/Facebook_f_logo_%282019%29.svg" alt="Facebook" class="social-icon">
						</a>
						<a href="https://www.instagram.com/liste_bdgaine" target="_blank" class="social-link">
							<img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram" class="social-icon">
						</a>
						<a href="https://www.youtube.com/channel/UCCh3iNnASbOWlj7oe-gCSBw" target="_blank" class="social-link">
							<img src="https://upload.wikimedia.org/wikipedia/commons/0/09/YouTube_full-color_icon_%282017%29.svg" alt="YouTube" class="social-icon">
						</a>
					</div>
				</div>
			</div>
			<a href="#la-liste" class="banner-link">La liste</a>
			<a href="#les-allos" class="banner-link">Les ALLOs</a>
		</nav>
		<img src="assets/images/logo.png" alt="Dragon droit" class="banner-dragon right">
	</div>
	<main class="main-content">
		<div class="welcome">Bienvenue au...</div>
		<h1 class="main-title">Bdgainé</h1>
	</main>
</main>

<section id="la-liste" class="liste-section">
	<div class="liste-banner">La liste</div>
	<div class="liste-blasons">
		<div class="blason-container" id="presentation-container">
			<div class="blason" id="blason-presentation">
				<img src="assets/images/blason.png" alt="Présentation" class="blason-img">
				<div class="blason-label">Présentation</div>
			</div>
			<div class="video-container" id="video-presentation">
				<iframe width="560" height="315" src="https://youtu.be/embed/4GSlqG8O580" 
					title="Vidéo de présentation" frameborder="0" 
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
					allowfullscreen>
				</iframe>
			</div>
		</div>
		<div class="blason-container" id="membres-container">
			<div class="blason" id="blason-membres">
				<img src="assets/images/blason.png" alt="Les membres" class="blason-img">
				<div class="blason-label">Les membres</div>
			</div>
			<div class="video-container" id="video-membres">
				<iframe width="560" height="315" src="https://www.youtube.com/embed/_vhf0RZg0fg" 
					title="Vidéo les membres" frameborder="0" 
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
					allowfullscreen>
				</iframe>
			</div>
		</div>
		<div class="blason-container" id="choree-container">
			<div class="blason" id="blason-choree">
				<img src="assets/images/blason.png" alt="La chorée" class="blason-img">
				<div class="blason-label">La chorée</div>
			</div>
			<div class="video-container" id="video-choree">
				<iframe width="560" height="315" src="https://youtu.be/embed/kJBah-Lo8aE" 
					title="Vidéo la chorée" frameborder="0" 
					allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
					allowfullscreen>
				</iframe>
			</div>
		</div>
	</div>
</section>
</section>

<section id="les-allos" class="allos-section">
	<div class="allos-banner">Les ALLOs</div>
	<div class="allos-fanion-container">
		<img src="assets/images/allos.jpeg" alt="Image des ALLOs" class="allos-fanion">
	</div>
</section>

<footer class="footer">
	<p>Fait avec 💚 par Bryan et Lou-Jane</p>
</footer>
</body>
</html>
